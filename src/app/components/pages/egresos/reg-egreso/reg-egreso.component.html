<ol class="breadcrumb" *ngFor="let pro of proyecto" >
  <li class="breadcrumb-item"><a href="javascript:void(0)" (click)="verProyecto()">Proyecto</a></li>
  <li class="breadcrumb-item active" aria-current="page"><a href="javascript:void(0)" (click)="cancelar()">Egresos</a></li>
  <li class="breadcrumb-item active" aria-current="page">{{pro.titulo}}</li>
  <ng-container *ngIf="codegre; else elsecodegre">
    <li class="breadcrumb-item active" aria-current="page">Modificar Egreso</li>
  </ng-container>
  <ng-template #elsecodegre>
    <li class="breadcrumb-item active" aria-current="page">Nuevo Egreso</li>
  </ng-template>
</ol>
<form [formGroup]="egreForm" fxLayout="column" fxLayoutAlign="center center" style=" width: 100%; height: 80%;">
    <div fxLayout="column" fxLayoutAlign="center center" class="bgg">
        <ng-container *ngIf="!codegre; else elseTemplate">
            <h3>REGISTRAR NUEVO EGRESO</h3>
        </ng-container>
        <ng-template #elseTemplate>
            <h3>MODIFICAR EGRESO</h3>
        </ng-template>
        <div fxLayout="row" fxLayoutGap="5px" class="forms">
            <mat-form-field appearance="fill" fxFlex>
                <mat-label>Monto a retirar:</mat-label>
                <input type="number" matInput formControlName="retiro" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('retiro')}}" max="{{maxbs}}" min="{{min}}" required>
                <mat-hint>disponible {{maxbs | number:'0.1-2'}}Bs - {{maxds | number:'0.1-2'}}$</mat-hint>
            </mat-form-field>
            <mat-form-field appearance="fill" fxFlex="40">
                <mat-label>Divisa:</mat-label>
                <mat-select matNativeControl formControlName="edivisa" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('edivisa')}}" required>
                    <mat-option value="Bolivianos">Bolivianos</mat-option>
                    <mat-option value="Dolares">Dolares</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <mat-form-field appearance="fill" class="forms">
            <mat-label>comprobante del egreso:</mat-label>
            <input type="number" matInput formControlName="cegreso" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('cegreso')}}" required>
        </mat-form-field>
        <div fxLayout="row" fxLayoutGap="100px">
            <button mat-raised-button color="primary" [disabled]="!egreForm.valid" (click)="guardar()">guardar</button>
            <button mat-raised-button color="warn" (click)="cancelar()">Cancelar</button>
        </div>
    </div>
</form>
