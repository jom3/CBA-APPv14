<div class="container mt-5 fs-6 bgg">
    <h1 class="text-center">ADMINISTRAR PERSONAS</h1>
    <mat-form-field>
        <input matInput placeholder="placeholder" name="personas" placeholder="buscar..." style="width: 300px;" [(ngModel)]="filtroPersonas">
    </mat-form-field>
    <!-- <input type="text" class="form-control" name="filt" placeholder="buscar..." style="width: 300px;" [(ngModel)]="filtroEtapas"> -->
    <table class="table table-striped text-center">
        <thead class="bg-dark text-white">
            <tr>
                <th scope="col" fxHide.xs>#</th>
                <th scope="col">Nombre</th>
                <th scope="col">Apellido Paterno</th>
                <th scope="col">Apellido Materno</th>
                <th scope="col">Estado</th>
                <th scope="col">Ver mas</th>
                <th scope="col">Modificar</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let per of personas | personas:filtroPersonas| paginate: { itemsPerPage: 4, currentPage: p }; index as i">
                <th scope="row" fxHide.xs>{{ i + 1 }}</th>
                <td>{{ per.nombre | titlecase}}</td>
                <td>{{ per.ap | titlecase}}</td>
                <td>{{ per.am | titlecase}}</td>
                <td>
                    <div *ngIf="per.estado!=0; else elseTemplate">
                        <img src="./assets/imagenes/act.png" alt="none">
                    </div>
                    <ng-template #elseTemplate>
                        <img src="./assets/imagenes/inac.png" alt="none">
                    </ng-template>
                </td>
                <td>
                    <a href="javascript:void(0)"><img src="./assets/imagenes/eye_black.png" alt="" [routerLink]="['/personas/verPersona', per.codper]" routerLinkActive="router-link-active"></a>
                </td>
                <td>
                    <a href="javascript:void(0)"><img src="./assets/imagenes/edit_black.png" alt="" [routerLink]="['/personas/modificarPersona', per.codper]" routerLinkActive="router-link-active"></a>
                </td>
            </tr>
        </tbody>
    </table>
    <div fxLayoutAlign="center">
        <pagination-controls (pageChange)="p = $event"></pagination-controls>
    </div>
</div>
