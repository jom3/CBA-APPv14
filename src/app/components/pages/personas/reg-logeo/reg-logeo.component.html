<form [formGroup]="logForm" fxLayout="column" fxLayoutAlign="center center" style=" width: 100%; height: 100%;" enctype="multipart/form-data">
    <mat-label class="labl">REGISTRO DE DATOS</mat-label>
    <mat-form-field appearance="fill" class="forms">
        <mat-label>Usuario:</mat-label>
        <input matInput formControlName="usuario" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('usuario')}}" required>
    </mat-form-field>
    <mat-form-field appearance="fill" class="forms">
        <mat-label>Contraseña:</mat-label>
        <input matInput type="password" formControlName="contraseña" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('contraseña')}}" required>
    </mat-form-field>
    <mat-form-field appearance="fill" class="forms">
        <mat-label>Repetir contraseña:</mat-label>
        <input matInput placeholder="" formControlName="contraseña2" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('contraseña2')}}" required>
    </mat-form-field>
    <div fxLayout="row" fxLayoutGap="100px">
        <button mat-raised-button color="primary" (click)="guardar()" [disabled]="!logForm.valid">guardar</button>
        <button mat-raised-button color="warn" [routerLink]="['/login']" routerLinkActive="router-link-active">Cancelar</button>
    </div>
</form>
