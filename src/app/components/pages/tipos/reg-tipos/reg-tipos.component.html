<ol class="breadcrumb">
  <li class="breadcrumb-item"><a href="javascript:void(0)" (click)="cancelar()">Tipos de proyectos</a></li>
  <ng-container *ngIf="codtipo; else elsecodi">
    <li class="breadcrumb-item active" aria-current="page">Modificar tipo de proyecto</li>
  </ng-container>
  <ng-template #elsecodi>
    <li class="breadcrumb-item active" aria-current="page">Nuevo tipo de proyecto</li>
  </ng-template>
</ol>
<form [formGroup]="tipoForm" fxLayout="column" fxLayoutAlign="center center" style=" width: 100%; height: 80%;">
    <div fxLayout="column" fxLayoutAlign="center center" class="bgg">
        <ng-container *ngIf="!codtipo; else elseTemplate">
            <h3>REGISTRAR NUEVO TIPO DE PROYECTO</h3>
        </ng-container>
        <ng-template #elseTemplate>
            <h3>MODIFICAR TIPO DE PROYECTO</h3>
        </ng-template>
        <mat-form-field appearance="fill" class="forms">
            <mat-label>Nombre:</mat-label>
            <input matInput formControlName="nombre" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('nombre')}}" required>
        </mat-form-field>
        <mat-form-field appearance="fill" class="forms">
            <mat-label>Descripcion:</mat-label>
            <textarea matInput placeholder="descripcion del tipo de proyecto" formControlName="descripcion" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('descripcion')}}" required></textarea>
        </mat-form-field>
        <div fxLayout="row" fxLayoutGap="100px">
            <button mat-raised-button color="primary" (click)="guardar()" [disabled]="!tipoForm.valid">guardar</button>
            <button mat-raised-button color="warn" (click)="cancelar()">Cancelar</button>
        </div>
    </div>
</form>
