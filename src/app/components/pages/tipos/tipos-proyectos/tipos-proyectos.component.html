<div class="container mt-5 fs-6 bgg">
    <h1 class="text-center">ADMINISTRAR TIPOS DE PROYECTOS</h1>
    <mat-form-field>
        <input matInput name="filtroTipos" placeholder="buscar..." style="width: 300px;" [(ngModel)]="filtroTipos">
    </mat-form-field>
    <button mat-raised-button color="primary" class="float-right" (click)="registrarNuevo()">
      Añadir
    <mat-icon>add</mat-icon>
    </button>
    <table class="table table-striped text-center">
        <thead class="bg-dark text-white">
            <tr>
                <th scope="col" fxHide.xs>#</th>
                <th scope="col">Nombre</th>
                <th scope="col" fxHide.xs fxHide.sm>Descripcion</th>
                <th scope="col">Estado</th>
                <th scope="col">Modificar</th>
                <th scope="col">Eliminar</th>
                <th scope="col">Restaurar</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let tip of tipos | tiposFiltro:filtroTipos | paginate: { itemsPerPage: 4, currentPage: p }; index as i">
                <th scope="row" fxHide.xs>{{ i + 1 }}</th>
                <td>{{ tip.nombre}}</td>
                <td fxHide.sm fxHide.xs>{{ tip.descripcion}}</td>
                <td>
                    <div *ngIf="tip.estado!=0; else elseTemplate">
                        <img src="./assets/imagenes/act.png" alt="none">
                    </div>
                    <ng-template #elseTemplate>
                        <img src="./assets/imagenes/inac.png" alt="none">
                    </ng-template>
                </td>
                <td>
                    <a href="javascript:void(0)"><img src="./assets/imagenes/edit_black.png" alt="" [routerLink]="['/tiposProyectos/modificarTipo', tip.codtipo]" routerLinkActive="router-link-active"></a>
                </td>
                <td>
                    <ng-container *ngIf="tip.estado==1; else eli">
                        <a href="javascript:void(0)"><img src="./assets/imagenes/del_black.png" alt="" (click)="eliminar(eliTipo,tip.codtipo,tip.nombre,tip.descripcion,tip.estado)"></a>
                    </ng-container>
                    <ng-template #eli>
                        <a><img src="./assets/imagenes/del_white.png" alt=""></a>
                    </ng-template>

                </td>
                <td>
                    <ng-container *ngIf="tip.estado==0; else res">
                        <a href="javascript:void(0)"><img src="./assets/imagenes/return_black.png" alt="" (click)="restaurar(eliTipo,tip.codtipo,tip.nombre,tip.descripcion,tip.estado)"></a>
                    </ng-container>
                    <ng-template #res>
                        <a><img src="./assets/imagenes/return_white.png" alt=""></a>
                    </ng-template>
                </td>
            </tr>
        </tbody>
    </table>
    <div fxLayoutAlign="center">
        <pagination-controls (pageChange)="p = $event"></pagination-controls>
    </div>
</div>
<ng-template #eliTipo>
    <mat-card class="example-card" *ngFor="let da of datos">
        <mat-card-header>
            <div mat-card-avatar class="example-header-image"></div>
            <ng-container *ngIf="da.estado==1; else borrRec">
                <mat-card-subtitle style="color: black;">Estas seguro de eliminar?</mat-card-subtitle>
            </ng-container>
            <ng-template #borrRec>
                <mat-card-subtitle style="color: black;">Estas seguro de recuperar?</mat-card-subtitle>
            </ng-template>
        </mat-card-header>
        <mat-card-content fxLayout="column" fxLayoutAlign="center center">
            <p style="color: red;">" {{da.nombre | uppercase}} "</p>
            <p style="color: blue;">{{da.descripcion}}</p>
        </mat-card-content>
        <mat-card-actions>
            <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="30px">
                <ng-container *ngIf="da.estado==1; else delres">
                    <button mat-raised-button color="primary" (click)="del(da.codtipo)">confirmar</button>
                </ng-container>
                <ng-template #delres>
                    <button mat-raised-button color="primary" (click)="res(da.codtipo)">confirmar</button>
                </ng-template>

                <button mat-raised-button color="warn" (click)="cancelar()">cancelar</button>
            </div>
        </mat-card-actions>
    </mat-card>
</ng-template>
