<mat-card fxLayout="column" fxLayoutAlign="center center">
    <form fxLayout="column" [formGroup]="cpForm">
        <h3>CAMBIAR CONTRASEÑA ACTUAL</h3>
        <mat-form-field appearance="fill" class="forms">
            <mat-label>Correo electronico actual:</mat-label>
            <input matInput formControlName="correo" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('correo')}}">
        </mat-form-field>
        <mat-form-field appearance="fill" class="forms">
            <mat-label>Nueva contraseña:</mat-label>
            <input type="password" matInput formControlName="pass1" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('pass1')}}" required>
        </mat-form-field>
        <mat-form-field appearance="fill" class="forms">
            <mat-label>Repita nueva contraseña:</mat-label>
            <input type="password" matInput formControlName="pass2" [matTooltipHideDelay]="10000" matTooltip="{{getErrorMessage ('pass2')}}" required>
        </mat-form-field>
        <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="10px">
            <button mat-raised-button color="warn" mat-dialog-close>Cancelar</button>
            <button mat-raised-button color="primary" (click)="guardar()" mat-dialog-close [disabled]="!cpForm.valid">Guardar</button>
        </div>
    </form>
</mat-card>
