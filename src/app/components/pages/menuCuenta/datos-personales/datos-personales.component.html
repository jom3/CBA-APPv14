<div fxLayoutAlign="center center" fxLayout="column" id="container">
    <h2 fxLayoutAlign="start start" id="tit1">PERFIL DEL USUARIO</h2>
    <hr style="width: 90%; color: rgb(47, 0, 255);">
    <div class="contain bgg" fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="30px">
        <div class="minicont" fxFlex="60" fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="20px" *ngFor="let per of persona">
            <div class="imgperfil" fxLayoutAlign="center center">
                <img [src]="'http://localhost:3000/api/imagenes/' + per.codper " style="width: 100%; height: 100%;"></div>
            <div fxLayout="column" fxLayoutAlign="center center">
                <h3>{{per.nombre | titlecase}} {{per.ap | titlecase}} {{per.am | titlecase}}</h3>
                <h3>{{per.email}}</h3>
                <h3>{{per.direccion}}</h3>
                <h3>{{per.telefono}}</h3>
            </div>
        </div>
        <div class="minicont" fxFlex="20" fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="20px">
            <button mat-raised-button color="primary" [routerLink]="['/personas/modificarPersona', codper]" routerLinkActive="router-link-active">Modificar perfil</button>
            <button mat-raised-button color="primary" (click)="volver()">Volver</button>
        </div>
    </div>
</div>
