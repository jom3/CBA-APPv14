<div class="container mt-5 fs-6 bgg">
    <h1 class="text-center">ADMINISTRAR ROLES</h1>
    <mat-form-field>
        <input matInput name="filtroRoles" placeholder="buscar..." style="width: 300px;" [(ngModel)]="filtroRoles">
    </mat-form-field>
    <button mat-raised-button color="primary" class="float-right" (click)="registrarNuevo()" hidden>
      Añadir
    <mat-icon>add</mat-icon>
    </button>
    <table class="table table-striped text-center">
        <thead class="bg-dark text-white">
            <tr>
                <th scope="col" fxHide.xs>#</th>
                <th scope="col">ROL</th>
                <th scope="col" >USO</th>
                <th scope="col" fxHide.xs>DESCRIPCION</th>
                <th scope="col">ESTADO</th>
                <!-- <th scope="col">MODIFICAR</th>
                <th scope="col">ELIMINAR</th>
                <th scope="col">RECUPERAR</th> -->
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let rol of roles | rolesFiltro:filtroRoles| paginate: { itemsPerPage: 4, currentPage: p }; index as i">
                <th scope="row" fxHide.xs>{{ i + 1 }}</th>
                <td>{{ rol.nombre | titlecase}}</td>
                <td fxHide.xs>{{ rol.tiporol | titlecase}}</td>
                <td fxHide.xs>{{ rol.descripcion}}</td>
                <td>
                    <div *ngIf="rol.estado!=0; else elseTemplate">
                        <img src="./assets/imagenes/act.png" alt="none">
                    </div>
                    <ng-template #elseTemplate>
                        <img src="./assets/imagenes/inac.png" alt="none">
                    </ng-template>
                </td>
                <!-- <td>
                    <ng-container *ngIf="rol.estado==1 && rol.tiporol!='Personal' && rol.tiporol!='Usuarios'; else mod">
                        <a href="javascript:void(0)"><img src="./assets/imagenes/edit_black.png" alt="" [routerLink]="['/roles/modificarRol', rol.codrol]" routerLinkActive="router-link-active"></a>
                    </ng-container>
                    <ng-template #mod>
                        <a><img src="./assets/imagenes/edit_white.png" alt=""></a>
                    </ng-template>

                </td>
                <td>
                    <ng-container *ngIf="rol.estado==1 && rol.tiporol!='Personal' && rol.tiporol!='Usuarios'; else eli">
                        <a href="javascript:void(0)"><img src="./assets/imagenes/del_black.png" alt="" (click)="eliminar(eliRol,rol.codrol,rol.nombre,rol.descripcion,rol.estado)"></a>
                    </ng-container>
                    <ng-template #eli>
                        <a><img src="./assets/imagenes/del_white.png" alt=""></a>
                    </ng-template>

                </td>
                <td>
                    <ng-container *ngIf="rol.estado==0 && rol.tiporol!='Personal' && rol.tiporol!='Usuarios'; else res">
                        <a href="javascript:void(0)"><img src="./assets/imagenes/return_black.png" alt="" (click)="restaurar(eliRol,rol.codrol,rol.nombre,rol.descripcion,rol.estado)"></a>
                    </ng-container>
                    <ng-template #res>
                        <a><img src="./assets/imagenes/return_white.png" alt=""></a>
                    </ng-template>
                </td> -->
            </tr>
        </tbody>
    </table>
    <div fxLayoutAlign="center">
        <pagination-controls (pageChange)="p = $event"></pagination-controls>
    </div>
</div>
<ng-template #eliRol>
    <mat-card class="example-card" *ngFor="let da of datos">
        <mat-card-header>
            <div mat-card-avatar class="example-header-image"></div>
            <ng-container *ngIf="da.estado==1; else borrRec">
                <mat-card-subtitle style="color: black;">Estas seguro de eliminar?</mat-card-subtitle>
            </ng-container>
            <ng-template #borrRec>
                <mat-card-subtitle style="color: black;">Estas seguro de recuperar?</mat-card-subtitle>
            </ng-template>
        </mat-card-header>
        <mat-card-content fxLayout="column" fxLayoutAlign="center center">
            <p style="color: red;">" {{da.nombre | uppercase}} "</p>
            <p style="color: blue;">{{da.descripcion}}</p>
        </mat-card-content>
        <mat-card-actions>
            <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="30px">
                <ng-container *ngIf="da.estado==1; else delres">
                    <button mat-raised-button color="primary" (click)="del(da.codrol)">confirmar</button>
                </ng-container>
                <ng-template #delres>
                    <button mat-raised-button color="primary" (click)="res(da.codrol)">confirmar</button>
                </ng-template>

                <button mat-raised-button color="warn" (click)="cancelar()">cancelar</button>
            </div>
        </mat-card-actions>
    </mat-card>
</ng-template>
