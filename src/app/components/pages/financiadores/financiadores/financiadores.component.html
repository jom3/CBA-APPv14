<div class="container mt-5 fs-6 bgg">
    <h1 class="text-center">ADMINISTRAR FINANCIADORES</h1>
    <mat-form-field>
        <input matInput name="filtroFinanciadores" placeholder="buscar..." style="width: 300px;" [(ngModel)]="filtroFinanciadores">
    </mat-form-field>
    <button mat-raised-button *ngIf="rol=='Administrador'" color="primary" class="float-right" (click)="registrarNuevo()">
      Añadir
    <mat-icon>add</mat-icon>
    </button>
    <table class="table table-striped text-center">
        <thead class="bg-dark text-white">
            <tr>
                <th scope="col" fxHide.xs>#</th>
                <th scope="col">Nombre del financiador</th>
                <th scope="col">Correo electronico</th>
                <th scope="col">Telefono</th>
                <th scope="col">Estado</th>
                <th scope="col" *ngIf="rol=='Administrador'">Eliminar</th>
                <th scope="col" *ngIf="rol=='Administrador'">Restaurar</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let finan of financiadores  | financiadoresFiltro:filtroFinanciadores | paginate: { itemsPerPage: 4, currentPage: p }; index as i">
                <th scope="row" fxHide.xs>{{ i + 1 }}</th>
                <td>{{ finan.nombre | titlecase}} </td>
                <td>{{ finan.email}} </td>
                <td>{{ finan.telefono}} </td>
                <td>
                    <div *ngIf="finan.estado!=0; else elseTemplate">
                        <img src="./assets/imagenes/act.png" alt="none">
                    </div>
                    <ng-template #elseTemplate>
                        <img src="./assets/imagenes/inac.png" alt="none">
                    </ng-template>
                </td>
                <td *ngIf="rol=='Administrador'">
                    <ng-container *ngIf="finan.estado==1 && finan.iestado==1; else eli">
                        <a href="javascript:void(0)"><img src="./assets/imagenes/del_black.png" alt="" (click)="eliminar(eliFinan,finan.codf,finan.nombre,finan.descripcion,finan.estado)"></a>
                    </ng-container>
                    <ng-template #eli>
                        <a><img src="./assets/imagenes/del_white.png" alt=""></a>
                    </ng-template>
                </td>
                <td *ngIf="rol=='Administrador'">
                    <ng-container *ngIf="finan.estado==0 && finan.iestado==1; else res">
                        <a href="javascript:void(0)"><img src="./assets/imagenes/return_black.png" alt="" (click)="restaurar(eliFinan,finan.codf,finan.nombre,finan.descripcion,finan.estado)"></a>
                    </ng-container>
                    <ng-template #res>
                        <a><img src="./assets/imagenes/return_white.png" alt=""></a>
                    </ng-template>
                </td>
            </tr>
        </tbody>
    </table>
    <div fxLayoutAlign="center">
        <pagination-controls (pageChange)="p = $event"></pagination-controls>
    </div>
</div>

<ng-template #eliFinan>
    <mat-card class="example-card" *ngFor="let da of datos">
        <mat-card-header>
            <div mat-card-avatar class="example-header-image"></div>
            <ng-container *ngIf="da.estado==1; else borrRec">
                <mat-card-subtitle style="color: black;text-align: center;">Estas seguro de eliminar?</mat-card-subtitle>
            </ng-container>
            <ng-template #borrRec>
                <mat-card-subtitle style="color: black;text-align: center;">Estas seguro de recuperar?</mat-card-subtitle>
            </ng-template>
        </mat-card-header>
        <mat-card-content fxLayout="column" fxLayoutAlign="center center" style="text-align: center;">
            <p style="color: red;">{{da.nombre | uppercase}}</p>
            <p style="color:blue">{{da.descripcion}}</p>
        </mat-card-content>
        <mat-card-actions>
            <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="30px">
                <ng-container *ngIf="da.estado==1; else delres">
                    <button mat-raised-button color="primary" (click)="del(da.codtipo)">confirmar</button>
                </ng-container>
                <ng-template #delres>
                    <button mat-raised-button color="primary" (click)="res(da.codtipo)">confirmar</button>
                </ng-template>
                <button mat-raised-button color="warn" (click)="cancelar()">cancelar</button>
            </div>
        </mat-card-actions>
    </mat-card>
</ng-template>
