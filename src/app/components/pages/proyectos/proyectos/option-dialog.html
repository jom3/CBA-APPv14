<div *ngFor="let pro of proyectos" fxLayout="column" fxLayoutAlign="center center">
    <div fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="5px">
        <h2>{{pro.titulo | uppercase}}</h2>
        <h3 style="color: rgba(255, 0, 0, 0.733);">
            <strong>
        Opciones
      </strong>
        </h3>
    </div>
    <mat-divider style="width: 100%;"></mat-divider>
    <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="20px">
        <div fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="5px">
            <h3>Eliminar</h3>
            <a href="javascript:void(0)"><img src="./assets/imagenes/del_black.png" alt="" (click)="eliminar(pro.codpro)" mat-dialog-close></a>
        </div>
        <div fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="5px">
            <h3>Restaurar</h3>
            <a href="javascript:void(0)"><img src="./assets/imagenes/atras.png" alt="" (click)="restaurar(pro.codpro)" mat-dialog-close></a>
        </div>
        <div fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="5px">
            <h3>Completar</h3>
            <a href="javascript:void(0)"><img src="./assets/imagenes/completado.png" alt="" (click)="confirmar(pro.codpro)" mat-dialog-close></a>
        </div>
    </div>
</div>
